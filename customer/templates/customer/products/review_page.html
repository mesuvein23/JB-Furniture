{% extends 'base.html' %}
{% load static %}

{% block title %}
<title>Jaya Barahi Furniture</title>
{% endblock title %}

{% block customcss %}

{% endblock customcss %}

{% block content%}

<form>
    <fieldset>
        <div class="container mt-5">
            <h2 class="mb-4 text-center">Product Review Form</h2>
            <form>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="fname" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="fname" name="firstname" placeholder="Your name..">
                    </div>
                    <div class="col-md-6">
                        <label for="lname" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lname" name="lastname"
                            placeholder="Your last name..">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="product" class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="product" name="product" placeholder="Product name..">
                </div>

                <div class="mb-3">
                    <label for="rating" class="form-label">Rating</label>
                    <select class="form-select" id="rating" name="rating">
                        <option value="">Choose...</option>
                        <option value="1">⭐ Poor</option>
                        <option value="2">⭐⭐ Fair</option>
                        <option value="3">⭐⭐⭐ Good</option>
                        <option value="4">⭐⭐⭐⭐ Very Good</option>
                        <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="review" class="form-label">Your Review</label>
                    <textarea class="form-control" id="review" name="review" rows="5"
                        placeholder="Share your thoughts..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Would you recommend this product?</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="recommend" id="recommendYes" value="yes">
                        <label class="form-check-label" for="recommendYes">Yes</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="recommend" id="recommendNo" value="no">
                        <label class="form-check-label" for="recommendNo">No</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-danger">Submit Review</button>
            </form>
        </div>

</form>
{% endblock content%}
