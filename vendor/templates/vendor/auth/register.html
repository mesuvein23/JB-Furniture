<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .file-upload-label {
            display: flex;
            align-items: center;
        }
        .file-upload-icon {
            margin-right: 10px;
        }
        .file-upload-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container col-md-6">
        <h2 class="text-center">Profile</h2>
        <form action="{% url 'vregister' %}" enctype="multipart/form-data" method="POST">
            {% csrf_token %}

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="first-name" class="form-label">First name</label>
                    <input type="text" name="fname" id="first-name" class="form-control" autocomplete="given-name">
                </div>
                <div class="col-md-6">
                    <label for="last-name" class="form-label">Last name</label>
                    <input type="text" name="lname" id="last-name" class="form-control" autocomplete="family-name">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                  <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text" id="username-addon">@</span>
                        <input type="text" name="username" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="username-addon">
                    </div>
                </div>
  
                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" name="email" id="email" class="form-control" autocomplete="email">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="password1" class="form-label">Password</label>
                    <input type="password" name="password1" id="pwd" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="password2" class="form-label">Confirm Password</label>
                    <input type="password2" name="password2" id="pwd2" class="form-control">
                </div>
            </div>

            

            
            
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Register</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-k2YH4Vo+5WcT3aF6pDq3Jz2E4ZVgJqzT6wB71Um5aFvvnh6zK/xwV48Ak2ZTbf0D" crossorigin="anonymous"></script>
</body>
</html>
